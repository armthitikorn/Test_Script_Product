<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sales E-Simulator</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { 
            font-family: 'Sarabun', sans-serif;
            padding: 20px; 
            text-align: center; 
            background-color: #f4f7f6;
            -webkit-text-size-adjust: 100%;
        }
        .container-box {
            max-width: 700px; 
            margin: 0 auto; 
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }
        h1 { font-size: 28px; color: #d9534f; margin-bottom: 20px; }
        h2 { margin-top: 25px; font-size: 22px; color: #337ab7; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 8px;
            margin: 10px;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
            font-weight: bold;
        }
        button:hover { background-color: #4cae4c; transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-stop { background-color: #d9534f; }
        .btn-stop:hover { background-color: #c9302c; }
        .btn-next { background-color: #f0ad4e; }
        
        .setup-section, .test-section { margin-bottom: 30px; text-align: left; }
        .instruction { font-size: 16px; color: #666; margin-bottom: 15px; line-height: 1.6; }
        .status-recording { color: #d9534f; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity:1;} 50% {opacity:0.4;} 100% {opacity:1;} }
        
        input[type="text"], select {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box;
        }
        .radio-group { display: flex; gap: 20px; margin: 10px 0; }
        
        #certificate {
            display: none; margin-top: 30px; padding: 40px; border: 10px double #d9534f; background: #fff; position: relative;
        }
        #certificate h2 { border: none; color: #d9534f; font-size: 32px; }
        
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #d9534f;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .progress { color:#888; font-size:14px; margin:0; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText" style="margin-top:15px; font-weight:bold;">กำลังบันทึกข้อมูล...</p>
    </div>

    <div class="container-box">
        <h1>🎙️ Sales E-Simulator</h1>

        <div id="setup" class="setup-section">
            <label>ชื่อ-นามสกุล:</label>
            <input type="text" id="inputUserName" placeholder="กรอกชื่อของคุณ">
            <label>สังกัด/กลุ่มงาน:</label>
            <input type="text" id="inputUserGroup" placeholder="กรอกชื่อกลุ่มงาน">

            <label>ระดับความยาก:</label>
            <div class="radio-group">
                <label><input type="radio" name="difficulty" value="easy" checked> ระดับปกติ (Easy)</label>
                <label><input type="radio" name="difficulty" value="hard"> ระดับท้าทาย (Hard)</label>
            </div>

            <label>เลือกประเภทประกัน:</label>
            <select id="productType">
                <option value="ME">สะสมทรัพย์พิเศษ</option>
            </select>
            <button id="startTestBtn" style="width:100%; margin:20px 0;">เริ่มการทดสอบ</button>
        </div>

        <div id="test" class="test-section" style="display:none;">
            <p class="progress" id="progress"></p>
            <h2 id="stepTitle"></h2>
            <p class="instruction" id="qText"></p>
            <div id="status"></div>
            <audio id="myAudio" controls style="display:none; width:100%; margin:10px 0;"></audio>
            <button id="playBtn">🔈 ฟังเสียงลูกค้า</button>
            <button id="recBtn" style="display:none;">🎤 กดเพื่อพูดตอบโต้</button>
            <button id="nextBtn" class="btn-next" style="display:none;">ถัดไป</button>
        </div>

        <div id="finish" class="test-section" style="display:none;">
            <h2>ตอบครบทุกขั้นตอนแล้ว</h2>
            <p class="instruction" id="finishInfo"></p>
            <div id="reviewList"></div>
            <button id="finalSaveBtn" style="background-color:#28a745;">✅ ส่งผลการทดสอบ</button>
        </div>

        <div id="certificate">
            <h2>ยินดีด้วย!</h2>
            <p style="font-size: 20px;">คุณ <strong><span id="traineeName"></span></strong></p>
            <p>ได้ทำการทดสอบ Sales E-Simulator เสร็จสิ้น</p>
            <p>วันที่ทดสอบ: <span id="issueDate"></span></p>
            <button id="certBtn" style="background:#d9534f;">พิมพ์/บันทึกใบประกาศ</button>
        </div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ที่เก็บข้อมูลแยกเฉพาะแอปนี้ (สร้างด้วย supabase_setup.sql) ไม่ใช้ร่วมกับตาราง/bucket เดิม
    const BUCKET = 'agent-recordings';
    const TABLE  = 'agent_recordings';
    const TEAM   = 'agent';

    // --- คลังข้อมูลเสียงลูกค้า (แก้ไข URL ไฟล์เสียงที่นี่) ---
    const scenarios = {
    s1: [ 
        // ช่วงเปิดการขาย และข้อโต้แย้งแรก (Opening & Objections)
        { text: "โทรมาจากไหนครับ? / ไม่สนใจครับ มีประกันเยอะแล้ว", audio: "audio/s1_1.mp3" },
        { text: "ตอนนี้ไม่สะดวกคุย ส่งเอกสารมาให้ดูก่อนได้ไหม?", audio: "audio/s1_2.mp3" },
        { text: "เอาข้อมูลมาจากไหนครับ? / ไม่ขออนุญาตบันทึกเสียงได้ไหม?", audio: "audio/s1_3.mp3" }
    ],
    s2: [ 
        // ช่วงนำเสนอแผน ความคุ้มครอง และผลประโยชน์ (Product Details & Coverage)
        { text: "ประกันตัวนี้คุ้มครองกี่ปี? จ่ายเบี้ยกี่ปี? ผ่าตัดใหญ่/อุบัติเหตุ/OPD ได้ไหม?", audio: "audio/s2_1.mp3" },
        { text: "ถ้าส่งไปถึงอายุ 60 ได้เงินคืน 200,000 แล้วคุ้มครองชีวิต 1 ล้านต่อจนถึงอายุ 80 จริงไหม?", audio: "audio/s2_2.mp3" },
        { text: "ถ้านอนโรงพยาบาลทั่วไป ชดเชยรายได้จ่ายวันละ 2,000 ตั้งแต่วันแรกเลยไหม?", audio: "audio/s2_3.mp3" },
        { text: "ถ้านอนห้อง ICU ได้วันละ 4,000 แล้วถ้าย้ายไปห้องธรรมดา จะคำนวณเงินชดเชยยังไง?", audio: "audio/s2_4.mp3" },
        { text: "ชดเชยสูงสุด 365 วัน ถ้าป่วยเป็นโรคเดิมแล้วเข้าๆ ออกๆ จะนับวันรวมกันยังไง?", audio: "audio/s2_5.mp3" },
        { text: "ผ่าตัดใหญ่แบบไม่ต้องนอน (Day Case) ได้ค่าผ่าตัด 20,000 + ค่าเวชภัณฑ์ 2,000 จริงไหม?", audio: "audio/s2_6.mp3" },
        { text: "ผ่าตัดเล็กผู้ป่วยนอก (OPD) 5,000 บาท เบิกได้เลยทันทีไหม มีข้อยกเว้นอะไรบ้าง?", audio: "audio/s2_7.mp3" },
        { text: "ถ้าผ่าตัด IPD มีทั้งค่าผ่าตัด ค่าเวชภัณฑ์ และนอนพักฟื้น สรุปเคสนี้จะได้เงินรวมกี่บาท?", audio: "audio/s2_8.mp3" },
        { text: "ค่าเวชภัณฑ์ 2,000 บาท รวมพวกพลาสเตอร์ ผ้ากอซ ค่ายากลับบ้านด้วยไหม?", audio: "audio/s2_9.mp3" }
    ],
    s3: [ 
        // ช่วงเงื่อนไขสุขภาพ การรับประกัน และข้อยกเว้น (Underwriting & Exclusions)
        { text: "ถ้าเป็นเบาหวาน ความดัน หรือโรคร้ายแรงอยู่แล้ว จะทำได้ไหม?", audio: "audio/s3_1.mp3" },
        { text: "สมัครวันนี้แล้วเกิดป่วยอาทิตย์หน้า เคลมชดเชยหรือค่าผ่าตัดได้เลยไหม?", audio: "audio/s3_2.mp3" },
        { text: "ถ้าเกิดอุบัติเหตุจากการขี่มอเตอร์ไซค์ หรือเล่นกีฬาเอ็กซ์ตรีม ตัวชดเชยคุ้มครองไหม?", audio: "audio/s3_3.mp3" },
        { text: "ข้อยกเว้นของสัญญาเพิ่มเติมชดเชยรายได้ มีอะไรบ้าง เช่น เมาแล้วขับเบิกได้ไหม?", audio: "audio/s3_4.mp3" }
    ],
    s4: [ 
        // ช่วงเบี้ยประกัน การชำระเงิน และสิทธิประโยชน์อื่นๆ (Premiums & Financials)
        { text: "เบี้ยเท่าไหร่? มีเงินคืนระหว่างทางไหม? ถ้ายกเลิกกลางคันจะเป็นยังไง?", audio: "audio/s4_1.mp3" },
        { text: "ส่งเบี้ยแพงไหมต่อปี? ถ้าคนอายุ 35 กับ 50 จ่ายเบี้ยเท่ากันหรือเปล่า?", audio: "audio/s4_2.mp3" },
        { text: "ถ้าเสียชีวิตก่อนอายุ 60 หรือหลัง 60 ผู้รับประโยชน์จะได้เงินเท่าไหร่?", audio: "audio/s4_3.mp3" },
        { text: "เงินคืนตอนอายุ 60 กับ 80 ปี ต้องเสียภาษีไหม? แล้วเบี้ยลดหย่อนภาษีได้เท่าไหร่?", audio: "audio/s4_4.mp3" },
        { text: "เบี้ยสัญญาหลักคงที่ไหม? แล้วสัญญาเพิ่มเติมสุขภาพ เบี้ยจะปรับเพิ่มตามอายุหรือเปล่า?", audio: "audio/s4_5.mp3" }
    ],
    s5: [ 
        // ช่วงปิดการขาย บริการหลังการขาย และการเคลม (Closing & After-sales)
        { text: "ขอคิดดูก่อน / ปรึกษาแฟนก่อน / เบี้ยแพงไปหน่อย และส่งยาวเกินไป", audio: "audio/s5_1.mp3" },
        { text: "ชดเชยรายได้ 2,000 บาท ต้องใช้ใบเสร็จตัวจริงไหม? ถ้ามีประกันกลุ่มเบิกซ้อนได้ไหม?", audio: "audio/s5_2.mp3" },
        { text: "ถ้าทำไปแล้ว อนาคตอยากยกเลิกแค่ตัวชดเชยรายได้ แต่เก็บสัญญาหลักไว้ทำได้ไหม?", audio: "audio/s5_3.mp3" },
        { text: "แฟกซ์เคลมได้เลยไหมเวลาไปนอนโรงพยาบาล หรือต้องสำรองจ่ายไปก่อน?", audio: "audio/s5_4.mp3" }
    ]
};

    const STEPS = [
        { key: 's1', title: 'Step 1: การเปิดใจและสร้างบรรยากาศ' },
        { key: 's2', title: 'Step 2: การนำเสนอผลิตภัณฑ์ (Pitching)' },
        { key: 's3', title: 'Step 3: การตอบข้อโต้แย้ง' },
        { key: 's4', title: 'Step 4: ข้อโต้แย้งระดับสูง' },
        { key: 's5', title: 'Step 5: การสรุปและปิดการขาย' }
    ];

    const $ = id => document.getElementById(id);
    const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
    const sessionId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
    const recs = {};            // "ขั้น-ข้อ" -> ข้อมูลเสียงที่อัดไว้ (อัดใหม่ = ทับของเดิม)
    const player = new Audio();
    let user = {}, si = 0, qi = 0, saved = false, busy = false;

    const curKey = () => (si + 1) + '-' + (qi + 1);
    const curList = () => scenarios[STEPS[si].key];
    const isLast = () => si === STEPS.length - 1 && qi === curList().length - 1;

    const load = () => {
        const q = curList()[qi];
        $('progress').textContent = 'ขั้นตอน ' + (si + 1) + '/' + STEPS.length + ' • ข้อ ' + (qi + 1) + '/' + curList().length;
        $('stepTitle').textContent = STEPS[si].title;
        $('qText').textContent = 'สถานการณ์: ' + q.text;
        $('status').innerHTML = '';
        $('myAudio').pause();
        $('myAudio').style.display = 'none';
        $('recBtn').textContent = '🎤 กดเพื่อพูดตอบโต้';
        $('recBtn').classList.remove('btn-stop');
        $('playBtn').disabled = false;
        $('nextBtn').textContent = isLast() ? 'เสร็จสิ้นการทดสอบ' : 'ถัดไป';
        show('playBtn', true); show('recBtn', false); show('nextBtn', false);
        window.scrollTo(0, 0);
    };

    $('startTestBtn').onclick = () => {
        const name = $('inputUserName').value.trim();
        const group = $('inputUserGroup').value.trim();
        if (!name) return alert('กรุณากรอกชื่อก่อนเริ่ม');
        if (!group) return alert('กรุณากรอกสังกัด/กลุ่มงาน');
        user = {
            name, group,
            difficulty: document.querySelector('input[name="difficulty"]:checked').value,
            product: $('productType').value
        };
        show('setup', false); show('test', true);
        load();
    };

    // --- เล่นเสียงลูกค้า (ปุ่มอัดเสียงจะโผล่หลังฟังจบ หรือเมื่อไฟล์เสียงเล่นไม่ได้) ---
    $('playBtn').onclick = () => {
        const q = curList()[qi];
        $('status').innerHTML = '🔈 กำลังเล่นเสียงลูกค้า...';
        const ready = html => { $('status').innerHTML = html; show('recBtn', true); };
        player.onended = () => ready('✅ ฟังจบแล้ว ตอบได้เลย');
        player.onerror = () => ready('<span style="color:#d9534f;">⚠️ เล่นเสียงไม่ได้ อ่านโจทย์ด้านบนแล้วตอบได้เลย</span>');
        player.src = q.audio;
        player.play().catch(() => {});
    };

    // --- บันทึกเสียง ---
    const pickMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']
        .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    let recorder = null;

    $('recBtn').onclick = async () => {
        if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
        if (!window.MediaRecorder) return alert('เบราว์เซอร์นี้ไม่รองรับการอัดเสียง กรุณาใช้ Chrome หรือ Safari เวอร์ชันล่าสุด');
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            return alert('ไม่สามารถใช้ไมโครโฟนได้ กรุณากดอนุญาตการเข้าถึงไมค์ในเบราว์เซอร์แล้วลองใหม่');
        }
        player.pause();
        $('myAudio').pause();
        $('myAudio').style.display = 'none';
        const mime = pickMime();
        const chunks = [];
        const k = curKey(), part = si + 1, qNum = qi + 1, qText = curList()[qi].text;
        const r = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        recorder = r;
        r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        r.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const type = r.mimeType || mime || 'audio/webm';
            if (recs[k] && recs[k].objUrl) URL.revokeObjectURL(recs[k].objUrl);
            const blob = new Blob(chunks, { type });
            recs[k] = { part, qNum, qText, type, ext: type.includes('mp4') ? 'm4a' : 'webm', blob, objUrl: URL.createObjectURL(blob) };
            $('myAudio').src = recs[k].objUrl;
            $('myAudio').style.display = 'block';
            $('status').innerHTML = '<p style="color:green;">✅ บันทึกคำตอบสำเร็จ ฟังเสียงตัวเองได้ด้านล่าง หรือกดอัดใหม่</p>';
            $('recBtn').textContent = '🎤 อัดใหม่';
            $('recBtn').classList.remove('btn-stop');
            $('playBtn').disabled = false;
            show('nextBtn', true);
        };
        r.start();
        $('status').innerHTML = '<p class="status-recording">🔴 กำลังบันทึกเสียงตอบของคุณ...</p>';
        $('recBtn').textContent = '⏹ หยุดบันทึก';
        $('recBtn').classList.add('btn-stop');
        $('playBtn').disabled = true;
        show('nextBtn', false);
    };

    $('nextBtn').onclick = () => {
        if (qi + 1 < curList().length) qi++;
        else if (si + 1 < STEPS.length) { si++; qi = 0; }
        else {
            show('test', false); show('finish', true);
            $('finishInfo').textContent = 'บันทึกคำตอบแล้ว ' + Object.keys(recs).length + ' ข้อ ฟังทบทวนได้ก่อน แล้วกดส่งผลการทดสอบ';
            const list = $('reviewList');
            list.innerHTML = '';
            Object.values(recs).sort((a, b) => a.part - b.part || a.qNum - b.qNum).forEach(r => {
                const box = document.createElement('div');
                box.style.margin = '14px 0';
                const t = document.createElement('div');
                t.style.fontSize = '14px';
                t.textContent = 'Step ' + r.part + ' ข้อ ' + r.qNum + ': ' + r.qText;
                const a = document.createElement('audio');
                a.controls = true;
                a.src = r.objUrl;
                a.style.width = '100%';
                box.append(t, a);
                list.append(box);
            });
            return;
        }
        load();
    };

    // --- ส่งผล: อัปโหลดเสียงเข้า bucket แล้วบันทึกแถวลงตาราง ---
    $('finalSaveBtn').onclick = async () => {
        if (busy) return;
        busy = true;
        $('finalSaveBtn').disabled = true;
        $('loadingOverlay').style.display = 'flex';
        const items = Object.values(recs).sort((a, b) => a.part - b.part || a.qNum - b.qNum);
        try {
            let n = 0;
            for (const r of items) {
                $('loadingText').textContent = 'กำลังอัปโหลดเสียง ' + (++n) + '/' + items.length + '...';
                if (r.url) continue; // อัปโหลดสำเร็จแล้วจากความพยายามก่อนหน้า
                const path = sessionId + '/p' + r.part + '_q' + r.qNum + '.' + r.ext;
                const { error } = await supabase.storage.from(BUCKET).upload(path, r.blob, { contentType: r.type });
                if (error) throw error;
                r.path = path;
                r.url = supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
            }
            $('loadingText').textContent = 'กำลังบันทึกข้อมูล...';
            const rows = items.map(r => ({
                session_id: sessionId, team: TEAM,
                trainee_name: user.name, trainee_group: user.group,
                difficulty: user.difficulty, product_type: user.product,
                part: r.part, q_num: r.qNum, q_text: r.qText,
                audio_path: r.path, audio_url: r.url, mime_type: r.type
            }));
            const { error } = await supabase.from(TABLE).insert(rows);
            if (error) throw error;
            saved = true;
            show('finish', false);
            $('traineeName').textContent = user.name;
            $('issueDate').textContent = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            $('certificate').style.display = 'block';
            window.scrollTo(0, 0);
        } catch (e) {
            console.error(e);
            alert('บันทึกไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วกดส่งอีกครั้ง\n' + (e.message || ''));
            $('finalSaveBtn').disabled = false;
            busy = false;
        } finally {
            $('loadingOverlay').style.display = 'none';
        }
    };

    $('certBtn').onclick = () => window.print();

    window.addEventListener('beforeunload', e => {
        if (Object.keys(recs).length && !saved) { e.preventDefault(); e.returnValue = ''; }
    });
</script>
</body>
</html>
